<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">


<!-- =========================================
     DISCORD PREVIEW
========================================= -->

<meta property="og:type"
      content="website">

<meta property="og:title"
      content="Peroro 5th Club Leaderboard">

<meta property="og:description"
      content="">

<meta property="og:image"
      content="https://carrotto-0w0.github.io/Peroro_5th_club_Leaderboard/preview.gif">

<meta property="og:image:type"
      content="image/gif">

<meta property="og:image:width"
      content="1920">

<meta property="og:image:height"
      content="716">

<meta name="twitter:card"
      content="summary_large_image">

<meta name="twitter:title"
      content="Peroro 5th Club Leaderboard">

<meta name="twitter:image"
      content="https://carrotto-0w0.github.io/Peroro_5th_club_Leaderboard/preview.gif">


<title>Peroro 5th Club Leaderboard</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* =====================================================
   IMAGE B
===================================================== */

.image {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 1;

    opacity: 0;

    transform:
        scale(1.12);

    filter:
        blur(20px)
        brightness(0.35)
        contrast(1.1);

    animation:
        revealImage
        2.1s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:
        0.35s;
}


/* =====================================================
   MAIN BLACK CURTAIN
===================================================== */

.intro {

    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at center,
            rgba(35,35,35,.25) 0%,
            rgba(0,0,0,.92) 55%,
            #000 100%
        );

    clip-path:
        inset(0 0 0 0);

    animation:
        introFade
        1.65s
        cubic-bezier(.77,0,.18,1)
        forwards;
}


/* =====================================================
   SECOND CURTAIN
   เพิ่มความรู้สึกเหมือนเปิดประตู
===================================================== */

.intro::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            to bottom,
            rgba(255,255,255,.06),
            transparent 18%,
            transparent 82%,
            rgba(255,255,255,.04)
        );

    opacity: .8;
}


/* =====================================================
   CENTER LIGHT BEAM
===================================================== */

.scan {

    position: absolute;

    left: -10%;

    width: 120%;

    top: 50%;

    height: 4px;

    background: #fff;

    box-shadow:

        0 0 5px #fff,

        0 0 15px #fff,

        0 0 35px rgba(255,255,255,.9),

        0 0 70px rgba(255,255,255,.7),

        0 0 130px rgba(255,255,255,.4);

    transform:
        translateY(0)
        scaleX(0);

    opacity: 0;

    animation:

        scanLine
        1.1s
        cubic-bezier(.77,0,.18,1)
        forwards;

    animation-delay:
        0.35s;
}


/* =====================================================
   LIGHT BEAM ABOVE / BELOW
===================================================== */

.scan::before {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    top: -35px;

    height: 70px;

    background:

        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.08),
            rgba(255,255,255,.18),
            rgba(255,255,255,.08),
            transparent
        );

    filter:
        blur(10px);
}


/* =====================================================
   ENERGY BURST
===================================================== */

.energy {

    position: fixed;

    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    z-index: 12;

    border-radius: 50%;

    background: white;

    box-shadow:

        0 0 15px white,
        0 0 40px white,
        0 0 100px white;

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    animation:

        energyBurst
        1.2s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:
        0.55s;
}


/* =====================================================
   ENERGY RAYS
===================================================== */

.energy::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 180vw;
    height: 2px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.9),
            transparent
        );

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    filter:
        blur(2px);
}


.energy::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 180vw;
    height: 2px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.7),
            transparent
        );

    transform:
        translate(-50%, -50%)
        rotate(-45deg);

    filter:
        blur(2px);
}


/* =====================================================
   FLASH
===================================================== */

.flash {

    position: fixed;

    inset: 0;

    z-index: 20;

    pointer-events: none;

    background:

        radial-gradient(
            circle at center,
            white 0%,
            rgba(255,255,255,.8) 10%,
            rgba(255,255,255,.25) 30%,
            transparent 65%
        );

    opacity: 0;

    animation:

        flash
        0.7s
        ease-out
        forwards;

    animation-delay:
        0.72s;
}


/* =====================================================
   VIGNETTE
===================================================== */

.vignette {

    position: fixed;

    inset: 0;

    z-index: 18;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.2) 65%,
            rgba(0,0,0,.7) 100%
        );

    opacity: 1;

    animation:

        vignetteFade
        2s
        ease-out
        forwards;

    animation-delay:
        0.2s;
}


/* =====================================================
   CINEMATIC LINES
===================================================== */

.lines {

    position: fixed;

    inset: 0;

    z-index: 16;

    pointer-events: none;

    opacity: 0;

    animation:

        linesFade
        1.8s
        ease-out
        forwards;

    animation-delay:
        0.3s;
}


.lines::before,
.lines::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );
}


.lines::before {

    top: 20%;
}


.lines::after {

    bottom: 20%;
}


/* =====================================================
   PARTICLES
===================================================== */

.particles {

    position: fixed;

    inset: 0;

    z-index: 17;

    pointer-events: none;

    overflow: hidden;
}


.particle {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:

        0 0 6px white,
        0 0 15px rgba(255,255,255,.8);

    left:
        var(--left);

    top:
        var(--top);

    opacity: 0;

    animation:

        particleMove
        var(--duration)
        ease-out
        forwards;

    animation-delay:
        var(--delay);
}


/* =====================================================
   IMAGE REVEAL
===================================================== */

@keyframes revealImage {

    0% {

        opacity: 0;

        transform:
            scale(1.12);

        filter:
            blur(20px)
            brightness(.35)
            contrast(1.1);
    }

    35% {

        opacity: .35;

        transform:
            scale(1.075);

        filter:
            blur(10px)
            brightness(.55)
            contrast(1.1);
    }

    65% {

        opacity: .9;

        transform:
            scale(1.025);

        filter:
            blur(3px)
            brightness(.85)
            contrast(1.05);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);

        filter:
            blur(0)
            brightness(1)
            contrast(1);
    }
}


/* =====================================================
   MAIN REVEAL
===================================================== */

@keyframes introFade {

    0% {

        clip-path:
            inset(0 0 0 0);
    }

    48% {

        clip-path:
            inset(0 0 48% 0);
    }

    68% {

        clip-path:
            inset(0 0 25% 0);
    }

    84% {

        clip-path:
            inset(0 0 8% 0);
    }

    100% {

        clip-path:
            inset(0 0 100% 0);
    }
}


/* =====================================================
   SCAN LINE
===================================================== */

@keyframes scanLine {

    0% {

        opacity: 0;

        transform:
            translateY(0)
            scaleX(0);
    }

    20% {

        opacity: 1;

        transform:
            translateY(0)
            scaleX(.15);
    }

    45% {

        opacity: 1;

        transform:
            translateY(0)
            scaleX(1);
    }

    100% {

        opacity: 0;

        transform:
            translateY(-48vh)
            scaleX(1);
    }
}


/* =====================================================
   ENERGY BURST
===================================================== */

@keyframes energyBurst {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    25% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(2);
    }

    60% {

        opacity: .8;

        transform:
            translate(-50%, -50%)
            scale(18);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(40);
    }
}


/* =====================================================
   FLASH
===================================================== */

@keyframes flash {

    0% {

        opacity: 0;
    }

    15% {

        opacity: .9;
    }

    35% {

        opacity: .35;
    }

    100% {

        opacity: 0;
    }
}


/* =====================================================
   VIGNETTE
===================================================== */

@keyframes vignetteFade {

    0% {

        opacity: 1;
    }

    60% {

        opacity: .7;
    }

    100% {

        opacity: 0;
    }
}


/* =====================================================
   CINEMATIC LINES
===================================================== */

@keyframes linesFade {

    0% {

        opacity: 0;
    }

    30% {

        opacity: .8;
    }

    100% {

        opacity: 0;
    }
}


/* =====================================================
   PARTICLES
===================================================== */

@keyframes particleMove {

    0% {

        opacity: 0;

        transform:
            translate(0, 0)
            scale(.2);
    }

    15% {

        opacity: 1;
    }

    70% {

        opacity: .8;
    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--driftX),
                var(--driftY)
            )
            scale(0);
    }
}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    .image {

        animation: none;

        opacity: 1;

        transform: none;

        filter: none;
    }

    .intro,
    .scan,
    .energy,
    .flash,
    .vignette,
    .lines,
    .particles {

        display: none;
    }
}

</style>

</head>


<body>


<!-- =================================================
     IMAGE B
================================================= -->

<img
    class="image"
    src="image-B.png"
    alt="Peroro 5th Club Leaderboard"
>


<!-- =================================================
     BLACK TRANSITION
================================================= -->

<div class="intro">

    <div class="scan"></div>

</div>


<!-- =================================================
     ENERGY
================================================= -->

<div class="energy"></div>


<!-- =================================================
     FLASH
================================================= -->

<div class="flash"></div>


<!-- =================================================
     VIGNETTE
================================================= -->

<div class="vignette"></div>


<!-- =================================================
     CINEMATIC LINES
================================================= -->

<div class="lines"></div>


<!-- =================================================
     PARTICLES
================================================= -->

<div class="particles"></div>


<script>

/* =====================================================
   CREATE PARTICLES
===================================================== */

const particleContainer =
    document.querySelector(".particles");


for (let i = 0; i < 55; i++) {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";


    particle.style.setProperty(
        "--left",
        Math.random() * 100 + "%"
    );


    particle.style.setProperty(
        "--top",
        (35 + Math.random() * 50) + "%"
    );


    particle.style.setProperty(
        "--duration",
        (0.8 + Math.random() * 1.5) + "s"
    );


    particle.style.setProperty(
        "--delay",
        (0.25 + Math.random() * 0.8) + "s"
    );


    particle.style.setProperty(
        "--driftX",
        (-180 + Math.random() * 360) + "px"
    );


    particle.style.setProperty(
        "--driftY",
        (-250 - Math.random() * 350) + "px"
    );


    const size =
        1 + Math.random() * 3;


    particle.style.width =
        size + "px";


    particle.style.height =
        size + "px";


    particleContainer.appendChild(
        particle
    );
}

</script>


</body>
</html>
