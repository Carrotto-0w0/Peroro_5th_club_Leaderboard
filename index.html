<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

      content="width=device-width, initial-scale=1.0">

<title>Peroro 5th Club Leaderboard</title>


<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* =========================
   IMAGE
========================= */

.image {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    opacity: 0;

    transform:
        scale(1.12);

    filter:
        blur(18px)
        brightness(0.5);

    animation:
        revealImage
        1.8s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:
        0.45s;
}


/* =========================
   BLACK INTRO
========================= */

.intro {

    position: fixed;

    inset: 0;

    z-index: 10;

    background: #000;

    pointer-events: none;

    animation:
        introFade
        1.5s
        cubic-bezier(.77,0,.18,1)
        forwards;
}


/* =========================
   SCAN LINE
========================= */

.scan {

    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 3px;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 30px white,
        0 0 70px white;

    transform:
        scaleX(0);

    animation:
        scanLine
        0.8s
        cubic-bezier(.77,0,.18,1)
        forwards;
}


/* =========================
   FLASH
========================= */

.flash {

    position: fixed;

    inset: 0;

    z-index: 20;

    background: white;

    opacity: 0;

    pointer-events: none;

    animation:
        flash
        0.5s
        ease-out
        forwards;

    animation-delay:
        0.65s;
}


/* =========================
   IMAGE ANIMATION
========================= */

@keyframes revealImage {

    0% {

        opacity: 0;

        transform:
            scale(1.12);

        filter:
            blur(18px)
            brightness(0.5);
    }

    45% {

        opacity: 1;

        filter:
            blur(4px)
            brightness(0.8);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);

        filter:
            blur(0)
            brightness(1);
    }
}


/* =========================
   INTRO ANIMATION
========================= */

@keyframes introFade {

    0% {

        clip-path:
            inset(0 0 0 0);
    }

    60% {

        clip-path:
            inset(0 0 45% 0);
    }

    100% {

        clip-path:
            inset(0 0 100% 0);
    }
}


/* =========================
   SCAN
========================= */

@keyframes scanLine {

    0% {

        transform:
            translateY(0)
            scaleX(0);
    }

    40% {

        transform:
            translateY(0)
            scaleX(1);
    }

    100% {

        transform:
            translateY(-48vh)
            scaleX(1);
    }
}


/* =========================
   FLASH
========================= */

@keyframes flash {

    0% {

        opacity: 0;
    }

    15% {

        opacity: 0.8;
    }

    100% {

        opacity: 0;
    }
}


/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    .image {

        animation: none;

        opacity: 1;

        transform: none;

        filter: none;
    }

    .intro,
    .scan,
    .flash {

        display: none;
    }
}

</style>

</head>


<body>


<!-- =========================
     IMAGE B
========================= -->

<img
    class="image"
    src="image-B.png"
    alt="Peroro 5th Club Leaderboard"
>


<!-- =========================
     TRANSITION
========================= -->

<div class="intro">

    <div class="scan"></div>

</div>


<div class="flash"></div>


</body>

</html>
