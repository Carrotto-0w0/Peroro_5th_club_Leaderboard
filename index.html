<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="Image">
    <meta property="og:description" content="">
    <meta property="og:image" content="https://karansin123.github.io/discord-image-switch/image-A.png">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://karansin123.github.io/discord-image-switch/image-A.png">

    <title>Image</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: pointer;
        }
    </style>
</head>

<body>

<img id="image" src="image-A.png">

<script>
    const image = document.getElementById("image");

    image.addEventListener("click", function () {
        if (image.src.includes("image-A.png")) {
            image.src = "image-B.png";
        } else {
            image.src = "image-A.png";
        }
    });
</script>

</body>
</html>
