<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">


<!-- =========================================
     DISCORD PREVIEW
========================================= -->

<meta property="og:type"
      content="website">

<meta property="og:title"
      content="Peroro 5th Club Leaderboard">

<meta property="og:description"
      content="">

<meta property="og:image"
      content="https://carrotto-0w0.github.io/Peroro_5th_club_Leaderboard/preview.gif">

<meta property="og:image:type"
      content="image/gif">

<meta property="og:image:width"
      content="1920">

<meta property="og:image:height"
      content="716">

<meta name="twitter:card"
      content="summary_large_image">

<meta name="twitter:title"
      content="Peroro 5th Club Leaderboard">

<meta name="twitter:image"
      content="https://carrotto-0w0.github.io/Peroro_5th_club_Leaderboard/preview.gif">


<title>Peroro 5th Club Leaderboard</title>


<style>

/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* =========================================
   GIF
========================================= */

.gif {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 1;

    opacity: 1;

    transform: scale(1);

    animation:
        gifExit
        0.8s
        cubic-bezier(.77,0,.18,1)
        forwards;

    animation-delay: 2.5s;
}


/* =========================================
   IMAGE B
========================================= */

.image {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 2;

    opacity: 0;

    transform: scale(1.08);

    filter:
        blur(14px)
        brightness(0.45);

    animation:
        imageReveal
        1.8s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay: 2.7s;
}


/* =========================================
   TRANSITION COVER
========================================= */

.transition {

    position: fixed;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    background: #050505;

    clip-path:
        inset(0 0 100% 0);

    animation:
        transitionOpen
        1.4s
        cubic-bezier(.77,0,.18,1)
        forwards;

    animation-delay: 2.4s;
}


/* =========================================
   CENTER LIGHT
========================================= */

.light {

    position: fixed;

    left: 0;
    right: 0;

    top: 50%;

    height: 3px;

    z-index: 10;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 20px white,
        0 0 45px white;

    transform:
        scaleX(0);

    opacity: 0;

    pointer-events: none;

    animation:
        lightSweep
        0.8s
        ease-out
        forwards;

    animation-delay: 2.45s;
}


/* =========================================
   FLASH
========================================= */

.flash {

    position: fixed;

    inset: 0;

    z-index: 20;

    background: white;

    opacity: 0;

    pointer-events: none;

    animation:
        flash
        0.45s
        ease-out
        forwards;

    animation-delay: 2.75s;
}


/* =========================================
   GIF EXIT
========================================= */

@keyframes gifExit {

    0% {

        opacity: 1;

        transform:
            scale(1);
    }

    50% {

        opacity: 1;

        transform:
            scale(1.025);
    }

    100% {

        opacity: 0;

        transform:
            scale(1.06);
    }
}


/* =========================================
   IMAGE B REVEAL
========================================= */

@keyframes imageReveal {

    0% {

        opacity: 0;

        transform:
            scale(1.08);

        filter:
            blur(14px)
            brightness(0.45);
    }

    35% {

        opacity: 0.35;

        filter:
            blur(7px)
            brightness(0.7);
    }

    70% {

        opacity: 1;

        filter:
            blur(2px)
            brightness(0.95);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);

        filter:
            blur(0)
            brightness(1);
    }
}


/* =========================================
   TRANSITION
========================================= */

@keyframes transitionOpen {

    0% {

        clip-path:
            inset(0 0 100% 0);
    }

    20% {

        clip-path:
            inset(0 0 70% 0);
    }

    50% {

        clip-path:
            inset(0 0 45% 0);
    }

    75% {

        clip-path:
            inset(0 0 15% 0);
    }

    100% {

        clip-path:
            inset(0 0 0 0);
    }
}


/* =========================================
   LIGHT SWEEP
========================================= */

@keyframes lightSweep {

    0% {

        opacity: 0;

        transform:
            scaleX(0);
    }

    20% {

        opacity: 1;

        transform:
            scaleX(0.25);
    }

    50% {

        opacity: 1;

        transform:
            scaleX(1);
    }

    100% {

        opacity: 0;

        transform:
            scaleX(1);
    }
}


/* =========================================
   FLASH
========================================= */

@keyframes flash {

    0% {
        opacity: 0;
    }

    20% {
        opacity: 0.7;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================
   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {

    .gif {

        animation: none;

        opacity: 0;
    }

    .image {

        animation: none;

        opacity: 1;

        transform: none;

        filter: none;
    }

    .transition,
    .light,
    .flash {

        display: none;
    }
}

</style>

</head>


<body>


<!-- =========================================
     1. GIF FIRST
========================================= -->

<img
    class="gif"
    src="preview.gif"
    alt="Preview"
>


<!-- =========================================
     2. IMAGE B
========================================= -->

<img
    class="image"
    src="image-B.png"
    alt="Peroro 5th Club Leaderboard"
>


<!-- =========================================
     3. TRANSITION
========================================= -->

<div class="transition"></div>


<!-- =========================================
     4. LIGHT
========================================= -->

<div class="light"></div>


<!-- =========================================
     5. FLASH
========================================= -->

<div class="flash"></div>


</body>

</html>
