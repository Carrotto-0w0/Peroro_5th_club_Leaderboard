<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Image</title>

    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        img {
            max-width: 100%;
            max-height: 100vh;
            cursor: pointer;
        }
    </style>
</head>

<body>

<img id="image" src="image-A.png">

<script>
    const image = document.getElementById("image");

    image.onclick = function () {
        image.src = "image-B.png";
    };
</script>

</body>
</html>
