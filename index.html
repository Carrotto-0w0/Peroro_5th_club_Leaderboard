<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<!-- =========================================
     DISCORD PREVIEW
========================================= -->

<meta property="og:type"
      content="website">

<meta property="og:title"
      content="Peroro 5th Club Leaderboard">

<meta property="og:description"
      content="">

<meta property="og:image"
      content="https://carrotto-0w0.github.io/Peroro_5th_club_Leaderboard/preview.gif">

<meta property="og:image:type"
      content="image/gif">

<meta property="og:image:width"
      content="1920">

<meta property="og:image:height"
      content="716">

<meta name="twitter:card"
      content="summary_large_image">

<meta name="twitter:title"
      content="Peroro 5th Club Leaderboard">

<meta name="twitter:image"
      content="https://carrotto-0w0.github.io/Peroro_5th_club_Leaderboard/preview.gif">

<title>Peroro 5th Club Leaderboard</title>


<style>

/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* =========================================
   IMAGE B
========================================= */

.image {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 1;

    opacity: 0;

    transform: scale(1.08);

    filter:
        blur(14px)
        brightness(.55);

    animation:
        revealImage
        1.5s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay: 2.75s;
}


/* =========================================
   BLACK INTRO
========================================= */

.intro {

    position: fixed;

    inset: 0;

    z-index: 10;

    background: #050505;

    pointer-events: none;

    clip-path:
        inset(0 0 0 0);

    animation:
        introFade
        2.8s
        cubic-bezier(.77,0,.18,1)
        forwards;
}


/* =========================================
   CENTER LINE
========================================= */

.scan {

    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 2px;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 20px rgba(255,255,255,.8),
        0 0 45px rgba(255,255,255,.35);

    transform:
        scaleX(0);

    opacity: 0;

    animation:
        scanLine
        1s
        cubic-bezier(.77,0,.18,1)
        forwards;

    animation-delay:
        .25s;
}


/* =========================================
   TEXT
========================================= */

.title {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    white-space: nowrap;

    opacity: 0;

    animation:
        titleAppear
        1.2s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:
        .9s;
}


/* =========================================
   TOP 5
========================================= */

.top {

    display: block;

    font-size:
        clamp(18px, 2vw, 32px);

    font-weight: 700;

    letter-spacing:
        .35em;

    margin-left:
        .35em;

    opacity: .85;

    text-transform:
        uppercase;
}


/* =========================================
   PERORO
========================================= */

.peroro {

    display: block;

    margin-top: 8px;

    font-size:
        clamp(42px, 6vw, 90px);

    font-weight: 900;

    letter-spacing:
        .12em;

    margin-left:
        .12em;

    text-transform:
        uppercase;

    text-shadow:
        0 0 8px rgba(255,255,255,.5),
        0 0 25px rgba(255,255,255,.25);
}


/* =========================================
   SMALL LINE UNDER TEXT
========================================= */

.title::after {

    content: "";

    display: block;

    width: 0;

    height: 1px;

    margin:
        18px auto 0;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 20px white;

    animation:
        titleLine
        .8s
        ease-out
        forwards;

    animation-delay:
        1.35s;
}


/* =========================================
   FLASH
========================================= */

.flash {

    position: fixed;

    inset: 0;

    z-index: 20;

    pointer-events: none;

    background: white;

    opacity: 0;

    animation:
        flash
        .55s
        ease-out
        forwards;

    animation-delay:
        2.45s;
}


/* =========================================
   FINAL LIGHT
========================================= */

.finalLight {

    position: fixed;

    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    z-index: 19;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 15px white,
        0 0 40px white,
        0 0 80px rgba(255,255,255,.6);

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    animation:
        finalLight
        .7s
        ease-out
        forwards;

    animation-delay:
        2.35s;
}


/* =========================================
   IMAGE REVEAL
========================================= */

@keyframes revealImage {

    0% {

        opacity: 0;

        transform:
            scale(1.08);

        filter:
            blur(14px)
            brightness(.55);
    }

    45% {

        opacity: .7;

        transform:
            scale(1.03);

        filter:
            blur(5px)
            brightness(.8);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);

        filter:
            blur(0)
            brightness(1);
    }
}


/* =========================================
   INTRO
========================================= */

@keyframes introFade {

    0% {

        clip-path:
            inset(0 0 0 0);
    }

    55% {

        clip-path:
            inset(0 0 42% 0);
    }

    72% {

        clip-path:
            inset(0 0 25% 0);
    }

    88% {

        clip-path:
            inset(0 0 8% 0);
    }

    100% {

        clip-path:
            inset(0 0 100% 0);
    }
}


/* =========================================
   SCAN
========================================= */

@keyframes scanLine {

    0% {

        opacity: 0;

        transform:
            scaleX(0);
    }

    25% {

        opacity: 1;

        transform:
            scaleX(.15);
    }

    50% {

        opacity: 1;

        transform:
            scaleX(1);
    }

    100% {

        opacity: 0;

        transform:
            translateY(-48vh)
            scaleX(1);
    }
}


/* =========================================
   TITLE
========================================= */

@keyframes titleAppear {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -45%)
            scale(.92);

        filter:
            blur(8px);
    }

    45% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);

        filter:
            blur(0);
    }

    80% {

        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -55%)
            scale(1.03);

        filter:
            blur(2px);
    }
}


/* =========================================
   TITLE LINE
========================================= */

@keyframes titleLine {

    0% {

        width: 0;
    }

    100% {

        width: 180px;
    }
}


/* =========================================
   FINAL LIGHT
========================================= */

@keyframes finalLight {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    30% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(3);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(35);
    }
}


/* =========================================
   FLASH
========================================= */

@keyframes flash {

    0% {
        opacity: 0;
    }

    15% {
        opacity: .85;
    }

    35% {
        opacity: .25;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================
   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {

    .image {

        animation: none;

        opacity: 1;

        transform: none;

        filter: none;
    }

    .intro,
    .scan,
    .title,
    .flash,
    .finalLight {

        display: none;
    }
}

</style>

</head>


<body>


<!-- =========================================
     IMAGE B
========================================= -->

<img
    class="image"
    src="image-B.png"
    alt="Peroro 5th Club Leaderboard"
>


<!-- =========================================
     BLACK INTRO + SCAN
========================================= -->

<div class="intro">

    <div class="scan"></div>

    <div class="title">

        <span class="top">
            TOP 5
        </span>

        <span class="peroro">
            PERORO
        </span>

    </div>

</div>


<!-- =========================================
     FINAL LIGHT
========================================= -->

<div class="finalLight"></div>


<!-- =========================================
     FLASH
========================================= -->

<div class="flash"></div>


</body>

</html>
